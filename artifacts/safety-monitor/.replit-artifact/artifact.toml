kind = "web"
previewPath = "/"
title = "Industrial Safety Monitor"
version = "1.0.0"
id = "artifacts/safety-monitor"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20053

[services.development]
run = "pnpm --filter @workspace/safety-monitor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/safety-monitor", "run", "build" ]
serve = "static"
publicDir = "artifacts/safety-monitor/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20053"
BASE_PATH = "/"
